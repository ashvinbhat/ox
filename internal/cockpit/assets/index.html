<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ox cockpit</title>
<link rel="stylesheet" href="https://unpkg.com/@xterm/xterm@5.5.0/css/xterm.css">
<style>
  :root {
    --bg: #1e1e2e; --panel: #181825; --border: #313244; --fg: #cdd6f4;
    --dim: #6c7086; --accent: #89b4fa; --green: #a6e3a1; --red: #f38ba8;
    --yellow: #f9e2af; --mauve: #cba6f7;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 13px/1.45 "SF Mono", ui-monospace, Menlo, monospace;
         display: flex; height: 100vh; overflow: hidden; }

  #sidebar { width: 320px; min-width: 320px; background: var(--panel);
             border-right: 1px solid var(--border); overflow-y: auto; padding: 10px; }
  #sidebar h1 { font-size: 14px; margin: 4px 6px 12px; color: var(--accent); }
  #sidebar h1 small { color: var(--dim); font-weight: normal; float: right; }

  .mission { border: 1px solid var(--border); border-radius: 8px; margin-bottom: 10px; overflow: hidden; }
  .mhead { padding: 8px 10px; background: #232336; cursor: default; }
  .mhead .id { color: var(--mauve); font-weight: bold; }
  .mhead .phase { color: var(--yellow); }
  .mhead .goal { display: block; color: var(--fg); white-space: nowrap;
                 overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .mhead .money { color: var(--dim); font-size: 12px; }
  .frozen { color: var(--red); }

  .sess { padding: 6px 10px; cursor: pointer; display: flex; gap: 8px; align-items: center;
          border-top: 1px solid var(--border); }
  .sess:hover { background: #26263a; }
  .sess.active { background: #2b2b45; border-left: 3px solid var(--accent); padding-left: 7px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); flex: none; }
  .dot.live { background: var(--green); }
  .sess .label { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sess .meta { color: var(--dim); font-size: 11px; }

  .jobs { padding: 4px 10px 8px; border-top: 1px solid var(--border); }
  .job { color: var(--dim); font-size: 11px; }
  .job .done { color: var(--green); } .job .failed { color: var(--red); } .job .running { color: var(--yellow); }

  .evs { padding: 4px 10px 8px; border-top: 1px dashed var(--border); color: var(--dim); font-size: 11px; }
  .prs a { color: var(--accent); font-size: 11px; }

  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #termhead { padding: 8px 14px; border-bottom: 1px solid var(--border);
              display: flex; align-items: center; gap: 10px; }
  #termhead .target { color: var(--accent); font-weight: bold; }
  #termhead .state { color: var(--dim); font-size: 12px; }
  #term { flex: 1; padding: 6px 4px 0 10px; min-height: 0; overflow: auto; }

  #inputbar { display: flex; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--border);
              background: var(--panel); }
  #msg { flex: 1; background: var(--bg); color: var(--fg); border: 1px solid var(--border);
         border-radius: 6px; padding: 8px 10px; font: inherit; }
  #msg:focus { outline: 1px solid var(--accent); }
  button { background: var(--accent); color: #11111b; border: 0; border-radius: 6px;
           padding: 8px 14px; font: inherit; font-weight: bold; cursor: pointer; }
  button.ghost { background: transparent; color: var(--mauve); border: 1px solid var(--mauve); }
  button.ghost:hover { background: #2b2b45; }
  #empty { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--dim); }

  #planview { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  #plantabs { padding: 6px 14px; border-bottom: 1px solid var(--border); }
  #plantabs button { padding: 3px 10px; margin-right: 6px; font-weight: normal; }
  #plantabs button.tab { background: transparent; color: var(--dim); border: 1px solid var(--border); }
  #plantabs button.tab.cur { color: var(--accent); border-color: var(--accent); }
  #plantext { flex: 1; overflow: auto; margin: 0; padding: 14px 18px; white-space: pre-wrap;
              font-size: 12.5px; line-height: 1.55; }
  #reviewbar { border-top: 1px solid var(--border); background: var(--panel); padding: 10px 14px; }
  #reviewtext { width: 100%; background: var(--bg); color: var(--fg); border: 1px solid var(--border);
                border-radius: 6px; padding: 8px 10px; font: inherit; resize: vertical; }
  #reviewbtns { display: flex; gap: 8px; margin-top: 8px; justify-content: flex-end; }
  button.ok { background: var(--green); }
  button.warn { background: var(--yellow); }
</style>
</head>
<body>
  <div id="sidebar">
    <h1>ox cockpit <small id="clock"></small></h1>
    <div id="missions"></div>
  </div>
  <div id="main">
    <div id="termhead">
      <span class="target" id="curtarget">—</span>
      <span class="state" id="streamstate"></span>
      <button id="histbtn" class="ghost" style="display:none;margin-left:auto;padding:4px 10px">history</button>
    </div>
    <div id="empty">select a session on the left</div>
    <div id="term" style="display:none"></div>
    <div id="planview" style="display:none">
      <div id="plantabs"></div>
      <pre id="plantext"></pre>
    </div>
    <div id="inputbar" style="display:none">
      <input id="msg" placeholder="type to the agent… (Enter sends · it lands exactly like typing in tmux)" autocomplete="off">
      <button id="send">Send</button>
      <button id="btw" class="ghost" title="context only — doesn't consume the agent's turn">/btw</button>
    </div>
    <div id="reviewbar" style="display:none">
      <textarea id="reviewtext" rows="3" placeholder="comments… (select text above and hit Quote to anchor a comment)"></textarea>
      <div id="reviewbtns">
        <button id="quotebtn" class="ghost">Quote selection</button>
        <button id="commentbtn" class="ghost">Send comments</button>
        <button id="changesbtn" class="warn">Request changes</button>
        <button id="approvebtn" class="ok">Approve</button>
      </div>
    </div>
  </div>

<script src="https://unpkg.com/@xterm/xterm@5.5.0/lib/xterm.js"></script>
<script>
const $ = s => document.querySelector(s);
let term = null, es = null, current = null;

function b64(s) {
  const bin = atob(s), bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

function ensureTerm(cols, rows, scrollback) {
  if (term) term.dispose();
  // Fixed geometry matching the real tmux pane — fitting to the browser
  // would desync every absolute-positioned redraw. Wide panes scroll.
  term = new Terminal({
    cols, rows, scrollback, fontSize: 12,
    theme: { background: '#1e1e2e', foreground: '#cdd6f4' },
    convertEol: false, disableStdin: true,
  });
  term.open($('#term'));
}

let mode = 'live';

function openStream(target) {
  if (es) es.close();
  current = target;
  mode = 'live';
  $('#curtarget').textContent = target;
  $('#streamstate').textContent = 'connecting…';
  $('#empty').style.display = 'none';
  $('#planview').style.display = 'none';
  $('#reviewbar').style.display = 'none';
  $('#term').style.display = 'block';
  $('#inputbar').style.display = 'flex';
  $('#histbtn').style.display = 'inline';
  $('#histbtn').textContent = 'history';
  document.querySelectorAll('.sess').forEach(el =>
    el.classList.toggle('active', el.dataset.target === target));

  es = new EventSource('/api/stream?target=' + encodeURIComponent(target));
  es.addEventListener('meta', e => {
    const m = JSON.parse(e.data);
    // Live view mirrors the pane exactly: no client scrollback — the pane's
    // past lives in tmux history (the history button).
    ensureTerm(m.cols, m.rows, 0);
  });
  es.addEventListener('full', e => { term.reset(); term.write(b64(e.data));
                                     $('#streamstate').textContent = 'live'; });
  es.addEventListener('out', e => { term.write(b64(e.data)); });
  es.addEventListener('err', e => { $('#streamstate').textContent = e.data; });
  es.onerror = () => { $('#streamstate').textContent = 'reconnecting…'; };
}

async function openHistory() {
  if (!current) return;
  if (es) es.close();
  mode = 'history';
  $('#histbtn').textContent = '⏵ live';
  $('#streamstate').textContent = 'history (read-only, scroll freely)';
  const r = await fetch('/api/history?target=' + encodeURIComponent(current));
  if (!r.ok) { $('#streamstate').textContent = 'history failed: ' + await r.text(); return; }
  const h = await r.json();
  ensureTerm(h.cols, 40, 12000);
  term.write(b64(h.data), () => term.scrollToBottom());
}

$('#histbtn').onclick = () => (mode === 'live' ? openHistory() : openStream(current));

// ---- plan review ----
let planMission = null, planFile = 'plan.md';

async function openPlan(mid, name) {
  planMission = mid; planFile = name || 'plan.md';
  if (es) es.close();
  current = 'ox-' + mid + ':orc';   // review actions talk to this mission's orc
  $('#curtarget').textContent = mid + ' / ' + planFile;
  $('#streamstate').textContent = 'review — actions go to the orchestrator';
  $('#histbtn').style.display = 'none';
  $('#empty').style.display = 'none';
  $('#term').style.display = 'none';
  $('#inputbar').style.display = 'none';
  $('#planview').style.display = 'flex';
  $('#reviewbar').style.display = 'block';

  const files = ['plan.md', 'decisions.md', 'findings.md', 'scratchpad.md'];
  $('#plantabs').innerHTML = files.map(f =>
    `<button class="tab ${f === planFile ? 'cur' : ''}" data-f="${f}">${f}</button>`).join('');
  document.querySelectorAll('#plantabs .tab').forEach(b => b.onclick = () => openPlan(mid, b.dataset.f));

  const r = await fetch(`/api/missionfile?mission=${mid}&name=${planFile}`);
  if (!r.ok) { $('#plantext').textContent = '(' + await r.text() + ')'; return; }
  const d = await r.json();
  $('#plantext').textContent = d.content;
  $('#streamstate').textContent = `review — ${d.path} · updated ${d.updated}`;
}

async function sendReview(kind) {
  const note = $('#reviewtext').value.trim();
  let text;
  if (kind === 'approve') {
    text = `Plan review (cockpit): APPROVED — proceed per ${planFile}.` + (note ? `\nNotes: ${note}` : '');
  } else if (kind === 'changes') {
    if (!note) { $('#streamstate').textContent = 'write what should change first'; return; }
    text = `Plan review (cockpit): CHANGES REQUESTED on ${planFile} — address each point, update the file, and re-request approval:\n${note}`;
  } else {
    if (!note) return;
    text = `Plan review (cockpit) comments on ${planFile} (respond, update the file where you agree, do not proceed to build yet):\n${note}`;
  }
  const res = await fetch('/api/send', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ target: current, text }),
  });
  $('#streamstate').textContent = res.ok ? 'sent to orchestrator ✓' : 'send failed: ' + await res.text();
  if (res.ok) $('#reviewtext').value = '';
}
$('#approvebtn').onclick = () => sendReview('approve');
$('#changesbtn').onclick = () => sendReview('changes');
$('#commentbtn').onclick = () => sendReview('comment');
$('#quotebtn').onclick = () => {
  const sel = window.getSelection().toString().trim();
  if (!sel) return;
  const quoted = sel.split('\n').map(l => '> ' + l).join('\n');
  $('#reviewtext').value = ($('#reviewtext').value + '\n' + quoted + '\n').trimStart();
  $('#reviewtext').focus();
};

async function send(background) {
  const text = $('#msg').value.trim();
  if (!text || !current) return;
  $('#msg').value = '';
  const res = await fetch('/api/send', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ target: current, text, background }),
  });
  if (!res.ok) $('#streamstate').textContent = 'send failed: ' + await res.text();
}
$('#send').onclick = () => send(false);
$('#btw').onclick = () => send(true);
$('#msg').addEventListener('keydown', e => { if (e.key === 'Enter') send(false); });

function sessRow(s) {
  const meta = [s.status, s.model, s.spend].filter(Boolean).join(' · ');
  return `<div class="sess ${s.target === current ? 'active' : ''}" data-target="${s.target}">
    <span class="dot ${s.live ? 'live' : ''}"></span>
    <span class="label">${s.label}</span>
    <span class="meta">${meta}</span>
  </div>`;
}

async function refresh() {
  try {
    const r = await fetch('/api/state');
    const data = await r.json();
    $('#clock').textContent = data.now;
    const html = (data.missions || []).map(m => `
      <div class="mission">
        <div class="mhead">
          <span class="id">${m.id}</span>
          <span class="phase">${m.type}/${m.phase}</span>
          ${m.task_seq ? '<span class="meta">#' + m.task_seq + '</span>' : ''}
          <span class="money" style="float:right">${m.spend}${m.frozen ? ' <span class=frozen>FROZEN</span>' : ''}</span>
          <span class="goal" title="${m.goal}">${m.goal}</span>
          <button class="tab planbtn" data-mid="${m.id}" style="margin-top:4px;padding:2px 8px;font-size:11px">📋 plan / review</button>
        </div>
        ${m.sessions.map(sessRow).join('')}
        ${m.jobs && m.jobs.length ? `<div class="jobs">${m.jobs.map(j =>
          `<div class="job"><span class="${j.status}">●</span> ${j.id} ${j.status} ${j.cost}</div>`).join('')}</div>` : ''}
        ${m.events && m.events.length ? `<div class="evs">${m.events.slice(-3).join('<br>')}</div>` : ''}
        ${m.prs && m.prs.length ? `<div class="evs prs">${m.prs.map(u => `<a href="${u}" target="_blank">${u.split('/').slice(-3).join('/')}</a>`).join('<br>')}</div>` : ''}
      </div>`).join('');
    $('#missions').innerHTML = html || '<div style="color:var(--dim);padding:8px">no open missions — <code>ox go &lt;task&gt;</code></div>';
    document.querySelectorAll('.sess').forEach(el =>
      el.onclick = () => openStream(el.dataset.target));
    document.querySelectorAll('.planbtn').forEach(el =>
      el.onclick = () => openPlan(el.dataset.mid));
  } catch (e) { /* server restarting */ }
}

refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
