<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title diai-id="iAVeTFjX">LinkedIn Video Ad Template</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-size: 14px;
        background-color: var(--background-color);
        color: var(--foreground-color);
      }
      :root {
        --cbx1-color-primary: #080808;
        --cbx1-color-secondary: #FFFFFF;
        --cbx1-color-tertiary: #080808;
        --cbx1-color-background: #080808;
        --cbx1-color-foreground: #FFFFFF;
        --cbx1-color-on-primary: #FFFFFF;
        --cbx1-color-on-secondary: #080808;
        --cbx1-color-on-tertiary: #FFFFFF;
      }
      .ad-container {
        width: 600px;
        max-width: 600px;
        margin-right: auto;
        margin-left: auto;
        margin-top: auto;
        margin-bottom: auto;
        overflow-x: hidden;
        overflow-y: hidden;
        box-shadow: rgba(0, 0, 0, 0.1) 0px 1px 3px;
        background-color: var(--background-color);
      }
      .cta-section {
        background-color: rgb(239, 246, 255);
      }
    </style>
  </head>
  <body class="w-[600px] bg-white mx-auto">
    <div class="flex items-center justify-center">
      <div class="ad-container rounded-2xl">
<!-- Header Section -->
        <div class="flex items-center justify-between p-4">
          <div class="flex items-center space-x-3"><img src="{{var:brandkit.icon.dark}}" alt="Company Logo" class="w-16 h-16" />
            <div class="font-light">
              <p diai-id="UKEgLFdJ" class="text-base font-semibold">
                {{var:companyInfo.name}}
              </p>
              <p diai-id="zfsmjpys" class="text-xs font-medium text-[#5B697E]">
                300k followers
              </p>
              <p diai-id="ykAyIRMW" class="text-xs font-medium text-[#5B697E]">
                Promoted
              </p>
            </div>
          </div>
          <div class="pointer-events-none select-none"><i class="fa-solid fa-ellipsis text-gray-500"></i></div>
        </div>
<!-- Description Section -->
        <div class="px-6 pb-4">
          <p vd="role:linkedin_description;charCount:(50,150);remark:Write a concise, engaging description for a LinkedIn video ad. Keep it short and compelling to encourage users to watch the video." id="description" diai-id="cVUkDvEn" class="text-sm font-normal text-black/90">
            Your video ad description goes here. Keep it concise and engaging.
          </p>
        </div>
<!-- Video Section -->
        <div class="w-[600px]">
          <video
            id="ad-video"
            src="{{var:videoAsset.sourceUrl}}"
            controls
            preload="metadata"
            class="w-full h-auto"
          ></video>
        </div>
<!-- CTA Section -->
        <div class="cta-section p-4">
          <div id="ad-cta-section" class="flex items-center justify-between">
            <div class="max-w-[60%]">
              <p id="title" diai-id="JNowRRqS" class="text-primary text-sm font-bold">
                Your headline goes here
              </p>
              <p generate="false" personalized="false" diai-id="pMcvaGJK" class="text-gray-500 text-xs">
                {{var:companyInfo.domain}}
              </p>
            </div>
            <div><button id="cta_label" grammar="{{topic:Call To Action.Download}}" generate="" vd="role:linkedin_cta;remark:this can be one of the following values - Apply, Download, View Quote, Learn More, Sign Up, Subscribe, Register, Join, Attend, Request Demo, See More" personalized="false" diai-id="OLUuvSMi" class="cta-button rounded-full px-3 font-semibold border border-[#0A66C2] text-[#0A66C2]">
                Download
              </button></div>
          </div>
        </div>
<!-- Footer Section -->
        <div>
          <div class="mx-4 flex flex-row justify-between border-b border-slate-100 py-2">
            <div class="flex flex-row"><span><svg width="16" height="16" xmlns="http://www.w3.org/2000/svg" id="like-consumption-small" data-supported-dps="16x16"><g fill="none" fillrule="evenodd"><rect width="16" height="16" rx="8"></rect><circle fill="#1485BD" cx="8" cy="8" r="7"></circle><path d="M11.93 7.25h-.55c-.05 0-.15-.19-.4-.46-.37-.4-.78-.91-1.07-1.19a7.18 7.18 0 01-1.73-2.24c-.24-.51-.26-.74-.75-.74a.77.77 0 00-.67.81c0 .14.07.63.1.8a7.62 7.62 0 001 2.2h.54-4.28a.87.87 0 00-.88.94.91.91 0 00.93.85h.16a.78.78 0 00-.76.8.81.81 0 00.74.8.8.8 0 00.33 1.42.79.79 0 00-.09.55.86.86 0 00.85.63h2.29c.3 0 .599-.038.89-.11l1.42-.42h1.9c1.02-.04 1.29-4.64.03-4.64z" fill="#E6F7FF"></path><path d="M7.43 6.43H4.11a.88.88 0 00-.88 1 .91.91 0 00.93.84h.16a.78.78 0 00-.76.8.83.83 0 00.74.81.81.81 0 00-.31.63.82.82 0 00.65.8.81.81 0 00-.09.56.86.86 0 00.85.62h2.29c.3 0 .599-.038.89-.11l1.42-.47h1.9c1 0 1.27-4.64 0-4.64a5 5 0 01-.55 0c-.05 0-.15-.19-.4-.46h0c-.37-.4-.78-.91-1.07-1.19a7.18 7.18 0 01-1.7-2.25 2 2 0 00-.32-.52.83.83 0 00-1.16.09 1.39 1.39 0 00-.25.38 1.49 1.49 0 00-.09.3 2.38 2.38 0 00.07.84c.064.288.155.569.27.84.188.353.41.688.66 1a.18.18 0 01.07.08" stroke="#004B7C" strokelinecap="round" strokelinejoin="round"></path></g></svg></span><span diai-id="krmCzdBy" class="ml-2 text-xs text-slate-700">47</span></div><span diai-id="erDnIabE" class="text-xs text-slate-700">21 Comments</span>
          </div>
          <div class="flex flex-row justify-between px-4 py-4"><button class="flex flex-row items-center text-slate-600"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" data-supported-dps="24x24" fill="currentColor" width="24" height="24" focusable="false"><path d="M19.46 11l-3.91-3.91a7 7 0 01-1.69-2.74l-.49-1.47A2.76 2.76 0 0010.76 1 2.75 2.75 0 008 3.74v1.12a9.19 9.19 0 00.46 2.85L8.89 9H4.12A2.12 2.12 0 002 11.12a2.16 2.16 0 00.92 1.76A2.11 2.11 0 002 14.62a2.14 2.14 0 001.28 2 2 2 0 00-.28 1 2.12 2.12 0 002 2.12v.14A2.12 2.12 0 007.12 22h7.49a8.08 8.08 0 003.58-.84l.31-.16H21V11zM19 19h-1l-.73.37a6.14 6.14 0 01-2.69.63H7.72a1 1 0 01-1-.72l-.25-.87-.85-.41A1 1 0 015 17l.17-1-.76-.74A1 1 0 014.27 14l.66-1.09-.73-1.1a.49.49 0 01.08-.7.48.48 0 01.34-.11h7.05l-1.31-3.92A7 7 0 0110 4.86V3.75a.77.77 0 01.75-.75.75.75 0 01.71.51L12 5a9 9 0 002.13 3.5l4.5 4.5H19z"></path></svg><span diai-id="hcahdIFL" class="pl-1 text-sm font-bold">Like</span></button><button class="flex flex-row items-center text-slate-600"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" data-supported-dps="24x24" fill="currentColor" width="24" height="24" focusable="false"><path d="M7 9h10v1H7zm0 4h7v-1H7zm16-2a6.78 6.78 0 01-2.84 5.61L12 22v-4H8A7 7 0 018 4h8a7 7 0 017 7zm-2 0a5 5 0 00-5-5H8a5 5 0 000 10h6v2.28L19 15a4.79 4.79 0 002-4z"></path></svg><span diai-id="xqfLehYk" class="pl-1 text-sm font-bold">Comment</span></button><button class="flex flex-row items-center text-slate-600"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" data-supported-dps="24x24" fill="currentColor" width="24" height="24" focusable="false"><path d="M23 12l-4.61 7H16l4-6H8a3.92 3.92 0 00-4 3.84V17a4 4 0 00.19 1.24L5.12 21H3l-.73-2.22A6.4 6.4 0 012 16.94 6 6 0 018 11h12l-4-6h2.39z"></path></svg><span diai-id="ZRXeUBod" class="pl-1 text-sm font-bold">Share</span></button><button class="flex flex-row items-center text-slate-600"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" data-supported-dps="24x24" fill="currentColor" width="24" height="24" focusable="false"><path d="M21 3L0 10l7.66 4.26L16 8l-6.26 8.34L14 24l7-21z"></path></svg><span diai-id="qxgGwXKk" class="pl-1 text-sm font-bold">Send</span></button></div>
        </div>
      </div>
    </div>
  </body>
</html>
