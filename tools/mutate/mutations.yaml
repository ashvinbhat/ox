# Each entry turns one rule off; the tests of the file's package must fail.
# `from` must appear exactly once in `file`. When code moves, update the
# entry; a rule worth a test is worth keeping on this list.

- why: the settings merge keeps hooks that aren't ox's
  file: internal/hooks/hooks.go
